<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Today — To-do</title>
  <style>
    :root{color-scheme:light;--ink:#18231f;--muted:#68746d;--paper:#f5f7f2;--card:#fff;--green:#28634b;--line:#e3e9e2;--orange:#b96332;--shadow:0 18px 45px #183a2810}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#e4efe5 0,transparent 28rem),var(--paper);color:var(--ink);font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(1040px,calc(100% - 36px));margin:58px auto 80px}.eyebrow{text-transform:uppercase;letter-spacing:.16em;color:var(--green);font-size:.76rem;font-weight:800}h1{font-family:Georgia,serif;font-size:clamp(2.5rem,7vw,4rem);line-height:1.03;margin:.4rem 0}.intro{color:var(--muted);margin:0 0 30px}.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(270px,.9fr);gap:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:var(--shadow)}h2{font-size:1.1rem;margin:0 0 18px}.add{display:grid;grid-template-columns:1fr auto;gap:10px}.field,select,button{font:inherit;border-radius:12px}.field,select{border:1px solid var(--line);background:#fff;padding:12px 14px;color:var(--ink);min-width:0}.field:focus,select:focus{outline:3px solid #28634b26;border-color:var(--green)}button{cursor:pointer;border:0;padding:11px 15px;background:var(--green);color:#fff;font-weight:700}button:hover{filter:brightness(1.08)}button.secondary{background:#edf3ed;color:var(--green)}button.danger{background:#fff0e9;color:#8b3d1d}.task-list{list-style:none;margin:20px 0 0;padding:0}.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:16px 0;border-top:1px solid var(--line)}.task:first-child{border-top:0}.task input{accent-color:var(--green);width:18px;height:18px;margin-top:3px}.task-title{font-weight:700;overflow-wrap:anywhere}.task.completed .task-title{text-decoration:line-through;color:var(--muted)}.meta{font-size:.82rem;color:var(--muted);display:flex;gap:9px;flex-wrap:wrap;margin-top:4px}.pill{border-radius:99px;background:#eef3ed;padding:2px 9px;color:#375441}.pill.high{background:#fff0e7;color:#9b4c20}.actions{display:flex;gap:7px}.actions button{padding:7px 10px;font-size:.82rem}.assistant{display:grid;gap:10px}.helper{color:var(--muted);font-size:.9rem;margin:-10px 0 4px}.message{min-height:24px;color:var(--green);font-size:.92rem}.side-actions{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.summary{background:#f5f8f4;border-radius:14px;padding:14px;color:#3a4d40;font-size:.9rem}.empty{color:var(--muted);padding:20px 0;text-align:center}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:760px){main{margin-top:32px}.layout{grid-template-columns:1fr}.card{padding:19px}.add{grid-template-columns:1fr}.task{grid-template-columns:auto 1fr}.actions{grid-column:2}}
  </style>
</head>
<body>
<main>
  <div class="eyebrow">A little more intentional</div>
  <h1>Make room for<br>what matters.</h1>
  <p class="intro">Your day, gathered in one calm place.</p>
  <div class="layout">
    <section class="card" aria-labelledby="tasks-heading">
      <h2 id="tasks-heading">Your tasks</h2>
      <form id="create-form" class="add">
        <label class="sr-only" for="new-task">Task</label><input class="field" id="new-task" placeholder="What needs doing?" required maxlength="300">
        <button type="submit">Add task</button>
      </form>
      <ul id="task-list" class="task-list" aria-live="polite"></ul>
      <div id="task-message" class="message" role="status"></div>
    </section>
    <aside class="card" aria-labelledby="assistant-heading">
      <h2 id="assistant-heading">Plan with a little help</h2>
      <p class="helper">Try “add buy milk tomorrow, high priority” or ask what to do next.</p>
      <form id="assistant-form" class="assistant">
        <label class="sr-only" for="assistant-input">Tell the assistant what you need</label>
        <textarea class="field" id="assistant-input" rows="3" placeholder="Add a task, or ask for a summary…" required></textarea>
        <button type="submit">Send request</button>
      </form>
      <div id="assistant-message" class="message" role="status"></div>
      <div class="side-actions"><button id="next-button" class="secondary" type="button">Suggest next</button><button id="summary-button" class="secondary" type="button">Daily summary</button></div>
      <div id="summary" class="summary" aria-live="polite">Your daily summary will appear here.</div>
    </aside>
  </div>
</main>
<script>
const list = document.querySelector('#task-list');
const taskMessage = document.querySelector('#task-message');
const assistantMessage = document.querySelector('#assistant-message');
const escapeHtml = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
async function request(path, options = {}) {
  const response = await fetch(path, {headers:{'Content-Type':'application/json'}, ...options});
  if (!response.ok) { const body = await response.json().catch(() => ({})); throw new Error(body.detail || 'Something went wrong.'); }
  return response.status === 204 ? null : response.json();
}
async function loadTasks() {
  try {
    const tasks = await request('/api/tasks');
    list.innerHTML = tasks.length ? tasks.map(task => `<li class="task ${task.completed?'completed':''}">
      <input type="checkbox" aria-label="${task.completed?'Reopen':'Complete'} ${escapeHtml(task.title)}" data-complete="${task.id}" ${task.completed?'checked':''}>
      <div><div class="task-title">${escapeHtml(task.title)}</div><div class="meta"><span class="pill ${task.priority==='high'?'high':''}">${escapeHtml(task.priority)} priority</span>${task.due_date?`<span>Due ${escapeHtml(task.due_date)}</span>`:''}</div></div>
      <div class="actions"><button class="secondary" data-edit="${task.id}" type="button">Edit</button><button class="danger" data-delete="${task.id}" type="button">Delete</button></div></li>`).join('') : '<li class="empty">Nothing on your list yet. Add one small thing to begin.</li>';
  } catch(error) { taskMessage.textContent = error.message; }
}
document.querySelector('#create-form').addEventListener('submit', async event => {
  event.preventDefault(); const input = document.querySelector('#new-task');
  try { await request('/api/tasks', {method:'POST', body:JSON.stringify({title:input.value})}); input.value=''; taskMessage.textContent='Task added.'; await loadTasks(); }
  catch(error) { taskMessage.textContent=error.message; }
});
list.addEventListener('change', async event => {
  const id = event.target.dataset.complete; if (!id) return;
  try { await request(`/api/tasks/${id}`, {method:'PATCH', body:JSON.stringify({completed:event.target.checked})}); taskMessage.textContent='Task updated.'; await loadTasks(); }
  catch(error) { taskMessage.textContent=error.message; await loadTasks(); }
});
list.addEventListener('click', async event => {
  const removeId = event.target.dataset.delete;
  if (removeId) { try { await request(`/api/tasks/${removeId}`, {method:'DELETE'}); taskMessage.textContent='Task deleted.'; await loadTasks(); } catch(error) { taskMessage.textContent=error.message; } return; }
  const editId = event.target.dataset.edit;
  if (editId) {
    try {
      const task = await request(`/api/tasks/${editId}`);
      const title = prompt('Task title', task.title); if (title === null) return;
      const priority = prompt('Priority: high, normal, or low', task.priority); if (priority === null) return;
      const due = prompt('Due date (YYYY-MM-DD), or leave blank', task.due_date || ''); if (due === null) return;
      await request(`/api/tasks/${editId}`, {method:'PATCH', body:JSON.stringify({title, priority, due_date:due || null})}); taskMessage.textContent='Task saved.'; await loadTasks();
    } catch(error) { taskMessage.textContent=error.message; }
  }
});
document.querySelector('#assistant-form').addEventListener('submit', async event => {
  event.preventDefault(); const input = document.querySelector('#assistant-input');
  try { const result = await request('/api/assistant', {method:'POST', body:JSON.stringify({text:input.value})}); assistantMessage.textContent=result.message; if(result.status==='completed') input.value=''; await loadTasks(); if(result.summary) showSummary(result.summary); }
  catch(error) { assistantMessage.textContent=error.message; }
});
document.querySelector('#next-button').addEventListener('click', async () => {
  try { const result=await request('/api/plan/next'); assistantMessage.textContent=result.task?`${result.task.title} — ${result.reason}`:result.reason; }
  catch(error) { assistantMessage.textContent=error.message; }
});
function showSummary(summary) { document.querySelector('#summary').textContent=`${summary.date}: ${summary.completed_today.length} completed today, ${summary.due_today.length} due today, ${summary.overdue.length} overdue.`; }
document.querySelector('#summary-button').addEventListener('click', async () => {
  try { const summary=await request('/api/summary'); showSummary(summary); }
  catch(error) { document.querySelector('#summary').textContent=error.message; }
});
loadTasks();
</script>
</body>
</html>
